<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Age Calculator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />

    <link rel="stylesheet" href="age_calculator.css" />
  </head>

  <body>
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">
          <section class="calculator-card" aria-labelledby="appTitle">
            <h1 class="app-title text-center" id="appTitle">Age Calculator</h1>


            <form id="ageForm" novalidate>

              <!-- Birthdate -->
              <div class="mb-4">
                <label class="form-label" for="birthdate">Birthdate</label>
                <input
                  type="text"
                  class="form-control"
                  id="birthdate"
                  name="birthdate"
                  placeholder="DD/MM/YYYY"
                  inputmode="numeric"
                  autocomplete="bday"
                  maxlength="10"
                  pattern="\d{2}/\d{2}/\d{4}"
                  aria-describedby="birthdateError"
                  required />

                <div class="invalid-feedback" id="birthdateError" aria-live="polite"></div>
              </div>

              <!-- Current date shoud probably be auto-filles by js -->
              <div class="mb-4">
                <label class="form-label" for="currentDate">Current date</label>
                <input
                  type="text"
                  class="form-control"
                  id="currentDate"
                  name="currentDate"
                  readonly />
              </div>

              <!-- Result -->
              <div class="mb-4">
                <label class="form-label" for="ageResult">Age</label>
                <output
                  class="form-control age-output d-block"
                  id="ageResult"
                  for="birthdate currentDate"
                  aria-live="polite"></output>
              </div>

              <button class="btn btn-primary btn-calculate w-100" type="submit" id="calculateBtn">
                Calculate
              </button>
            </form>
          </section>
        </div>
      </div>
    </main>


    <script src="age_calculator.js"></script>
  </body>
</html>
